body{display:flex;flex-direction:column;overflow:hidden}

#sub{margin:0 0 10px;font-size:12.5px;color:#777}

#q{flex:1 1 220px;min-width:160px;font:inherit;font-size:13px;padding:8px 11px;border:1px solid #ccc;border-radius:8px}

#count{font-size:12px;color:#888;white-space:nowrap}
main{flex:1;overflow-y:auto;padding:10px 18px 12px}
#pager{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:12px}

#pager button.on{background:#222;color:#fff;border-color:#222}
#pager button:disabled{opacity:.35;cursor:default}
h2{font-size:14px;font-weight:bold;color:#555;margin:20px 0 8px;padding-bottom:4px;border-bottom:1px solid #eee}
h2 span{font-weight:normal;color:#aaa;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:2px 4px}
.card{border:1px solid transparent;border-radius:6px;padding:4px 2px 3px;text-align:center;cursor:pointer;background:#fff;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:#ddd;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card img{display:block;width:100%;height:30px;object-fit:contain;margin-bottom:6px}
.card .n{font-size:9px;color:#666;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic;word-break:break-word}
.card .e{display:none}
.dom .card .n{font-style:normal}
.x{font-style:normal;font-weight:bold;margin-right:2px}
#empty{display:none;color:#999;font-size:13px;padding:30px 0;text-align:center}
#legend{font-size:11.5px;color:#999;margin-top:18px;line-height:1.5}
#tip{position:fixed;pointer-events:none;background:rgba(30,30,30,.9);color:#fff;padding:6px 10px;border-radius:6px;font-size:13px;line-height:1.35;display:none;z-index:9;white-space:nowrap}
#tip span{opacity:.75;font-size:11px}
#big{position:fixed;pointer-events:none;z-index:8;background:#fff;border:1px solid #ddd;border-radius:12px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:none}
#big img{display:block;width:230px;height:170px;object-fit:contain}
#cap{font-size:12.5px;text-align:center;margin-top:6px;max-width:230px}#cap span{display:block;color:#888;font-size:11px;margin-top:2px}
@media (hover:none){#big{display:none!important}}

     g:'',key:norm(r[1]+' '+r[2]+' '+r[3])}));
}
function setFilter(){
  flt.innerHTML='';
  if(tab==='wild'){
    const fams=[...new Set(WILD.map(r=>r[3]))];
    flt.innerHTML='<option value="">Toutes les familles</option><option value="!x">Actuelles seulement</option><option value="x">Éteintes et fossiles (†) seulement</option>'+
      fams.map(f=>'<option value="'+f+'">'+f+'</option>').join('');
    flt.style.display='';
  } else flt.style.display='none';
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function render(){
  const s=norm(q.value.trim()), fv=flt.value;
  let it=items().filter(o=>!s||o.key.includes(s));
  if(tab==='wild'&&fv){ if(fv==='x') it=it.filter(o=>o.x); else if(fv==='!x') it=it.filter(o=>!o.x); else it=it.filter(o=>o.g===fv); }
  cnt.textContent=it.length+' silhouette'+(it.length>1?'s':'');
  empty.style.display=it.length?'none':'block';
  legend.style.display=(tab==='wild'||tab==='dog')?'block':'none';
  list.className=tab==='wild'?'':'dom';
  if(tab!=='wild') it.sort((a,b)=>a.t.localeCompare(b.t,'fr'));
  const np=Math.max(1,Math.ceil(it.length/PER)); if(page>=np) page=np-1;
  it=it.slice(page*PER,(page+1)*PER);
  const groups=[];const byG={};
  it.forEach(o=>{ if(!byG[o.g]){byG[o.g]=[];groups.push(o.g);} byG[o.g].push(o); });
  let h='';
  groups.forEach(g=>{
    const arr=byG[g];
    if(g) h+='<h2>'+esc(g)+' <span>('+arr.length+')</span></h2>';
    h+='<div class="grid">'+arr.map(o=>{
      const name=(o.x?'<span class="x">†</span>':'')+esc(o.t);
      const sub=o.e&&o.e.toLowerCase()!==o.t.toLowerCase()?'<div class="e">'+esc(o.e)+(o.fci?' · FCI '+o.fci:'')+'</div>':(o.fci?'<div class="e">FCI '+o.fci+'</div>':'');
      return '<div class="card" data-f="'+esc(o.f)+'" data-l="'+esc((o.x?'† ':'')+o.t+(o.e&&o.e.toLowerCase()!==o.t.toLowerCase()?' ('+o.e+')':'')+(o.fci?' · FCI '+o.fci:''))+'"><img loading="lazy" alt="'+esc(o.t)+'" src="'+BASE+encodeURI(o.f)+'.svg"><div class="n">'+name+'</div>'+sub+'</div>';
    }).join('')+'</div>';
  });
  list.innerHTML=h; document.getElementById('main').scrollTop=0;
  let p='';
  if(np>1){p+='<button data-p="'+(page-1)+'"'+(page?'':' disabled')+'>‹</button>';
    for(let k=0;k<np;k++) p+='<button data-p="'+k+'"'+(k===page?' class="on"':'')+'>'+(k+1)+'</button>';
    p+='<button data-p="'+(page+1)+'"'+(page<np-1?'':' disabled')+'>›</button>';}
  pager.innerHTML=p;
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  tab=b.dataset.t; q.value=''; page=0; setFilter(); render();
});
pager.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;page=+b.dataset.p;render();});
q.addEventListener('input',()=>{page=0;render();}); flt.addEventListener('change',render);

/* survol : apercu agrandi + info-bulle ; clic : telechargement via get.html */
list.addEventListener('mouseover',e=>{const c=e.target.closest('.card'); if(!c) return;
  document.getElementById('cap').innerHTML='<i>'+esc(c.dataset.l)+'</i><span>Cliquer pour télécharger (SVG)</span>';
  bigImg.src=c.querySelector('img').src; big.style.display='block';});
list.addEventListener('mouseout',e=>{const c=e.target.closest('.card'); if(c&&!c.contains(e.relatedTarget)){tip.style.display='none';big.style.display='none';}});
list.addEventListener('mousemove',e=>{
  let x=e.clientX+16,y=e.clientY+16;
  if(x+tip.offsetWidth>innerWidth-8)x=e.clientX-tip.offsetWidth-16;
  if(y+tip.offsetHeight>innerHeight-8)y=e.clientY-tip.offsetHeight-16;
  tip.style.left=x+'px'; tip.style.top=y+'px';
  const bw=big.offsetWidth,bh=big.offsetHeight;
  let bx=e.clientX-bw-20, by=e.clientY-bh/2;
  if(bx<8) bx=e.clientX+24; if(by<8) by=8; if(by+bh>innerHeight-8) by=innerHeight-bh-8;
  if(bx+bw>innerWidth-8){ bx=Math.max(8,innerWidth-bw-8); }
  big.style.left=bx+'px'; big.style.top=by+'px';
});
list.addEventListener('click',e=>{const c=e.target.closest('.card'); if(!c) return;
  const url=BASE+'get.html?f='+encodeURIComponent(c.dataset.f+'.svg');
  const w=window.open(url,'_blank'); if(!w) location.href=url;
});
setFilter(); render();
})();
</script></body></html>
